services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pocketlog_app
    volumes:
      - ./src:/var/www/html
    networks:
      - shared_db_net

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: pocketlog_nginx
    ports:
      - "8002:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shared_db_net

networks:
  shared_db_net:
    external: true
